<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, user-scalable=yes" name="viewport">
    <meta name="theme-color" content="#0b1120">
    <meta name="color-scheme" content="dark">
    <title>SPCLib · Script Browser</title>
    <meta name="description"
        content="Live search and filter for all SPCLib Lua scripts for SAPP, Phasor, and Chimera for Halo PC / Custom Edition.">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/jpeg" href="../assets/images/logo.jpg">
    <link href="../assets/css/core.css" rel="stylesheet">
    <style>
        body {
            padding: 2rem 1.5rem;
        }

        .category-filters {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            background: var(--bg-elevated);
            padding: 0.6rem 1rem;
            border-radius: var(--radius-xl);
            align-items: center;
        }

        .cat-btn {
            background: #1a253d;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background var(--t-fast), color var(--t-fast);
            font-family: inherit;
        }

        .cat-btn.active {
            background: var(--accent);
            color: white;
        }

        .cat-btn:hover:not(.active) {
            background: #2e3f60;
        }

        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.3rem;
            margin-top: 0.5rem;
            min-height: 200px;
        }

        .script-card {
            background: rgba(17, 24, 38, 0.9);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            padding: 1rem 1.2rem 1.2rem;
            transition: border-color var(--t-base), background var(--t-base), transform var(--t-fast);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
        }

        .script-card:hover {
            border-color: #4c6b9b;
            background: rgba(18, 27, 44, 0.9);
            transform: translateY(-2px);
        }

        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .script-name {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-weight: 600;
            font-size: 0.95rem;
            background: rgba(3, 7, 15, 0.55);
            padding: 0.25rem 0.8rem;
            border-radius: var(--radius-pill);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            word-break: break-all;
            color: var(--text-secondary);
            text-decoration: none;
            transition: background var(--t-fast), color var(--t-fast);
            border: none;
            cursor: pointer;
            font-family: 'SF Mono', 'Fira Code', monospace;
            text-align: left;
        }

        .script-name:hover {
            background: var(--bg-chip-hover);
            color: white;
        }

        .platform-tag {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .tag-sapp {
            background: #1b5e20;
            color: #c8e6c9;
        }

        .tag-phasor {
            background: #0d3b66;
            color: #bbdef5;
        }

        .tag-chimera {
            background: #4a148c;
            color: #e1bee7;
        }

        .tag-release {
            background: #bf360c;
            color: #ffccbc;
        }

        .script-desc {
            font-size: 0.8rem;
            color: #b9d0f0;
            margin: 0.7rem 0 0.8rem;
            line-height: 1.5;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .card-meta {
            font-size: 0.7rem;
            color: #8aa9d0;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .card-links {
            display: flex;
            gap: 0.5rem;
        }

        .card-link {
            font-size: 0.7rem;
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: background var(--t-fast), color var(--t-fast);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .link-source {
            background: #1f2a44;
            color: #a5c1ff;
            border: 1px solid #3d567c;
        }

        .link-source:hover {
            background: #3a5580;
            color: white;
        }

        .link-release {
            background: #ff8c42;
            color: #1c1f2e;
            border: none;
        }

        .link-release:hover {
            background: var(--accent-orange);
        }

        .skeleton-card {
            background: rgba(17, 24, 38, 0.7);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            padding: 1rem 1.2rem 1.2rem;
            height: 140px;
            overflow: hidden;
            position: relative;
        }

        .skeleton-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.04), transparent);
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .skeleton-card::after {
                animation: none;
            }
        }

        @media (max-width: 700px) {
            .script-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Script Browser</h1>
                <p class="sub">SPCLib scripts · SAPP / Phasor / Chimera</p>
            </div>
            <div aria-live="polite" class="stat-card" id="statusCard" style="background:#0c1120;">
                <span id="statusMsg">🌐 Loading metadata from GitHub…</span>
            </div>
        </div>

        <div class="stats-row" id="statsSummary">
            <div class="stat-card">
                <span class="stat-number" id="totalScripts">0</span>
                <div class="stat-label">Total Scripts</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="platformScripts">0</span>
                <div class="stat-label">Current Platform</div>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="activeCategories">0</span>
                <div class="stat-label">Categories (SAPP/Phasor)</div>
            </div>
        </div>

        <div class="tabs" id="platformTabs" role="tablist" aria-label="Script platform"></div>
        <div aria-label="Category filters" class="category-filters" id="categoryFiltersContainer" role="group"></div>

        <div class="controls">
            <div class="search-area">
                <label class="sr-only" for="searchInput">Search scripts</label>
                <input class="search-input" id="searchInput" placeholder="🔎 Filter by name, description…"
                    type="search">
                <label class="sr-only" for="sortSelect">Sort</label>
                <select id="sortSelect">
                    <option value="name_asc">📖 Name A → Z</option>
                    <option value="name_desc">📖 Name Z → A</option>
                </select>
                <label class="sr-only" for="pageSizeSelect">Page size</label>
                <select class="page-size" id="pageSizeSelect">
                    <option value="10">10 per page</option>
                    <option value="20">20 per page</option>
                    <option value="35">35 per page</option>
                    <option value="50">50 per page</option>
                </select>
                <button class="clear-btn" id="clearFiltersBtn" type="button">✖️ Clear filters</button>
            </div>
        </div>

        <div aria-live="polite" class="script-grid" id="scriptGrid"></div>

        <div class="pagination" id="paginationControls">
            <button class="page-btn" id="prevPageBtn" type="button">◀ Prev</button>
            <span id="pageInfo" style="font-weight:500;">Page 0</span>
            <button class="page-btn" id="nextPageBtn" type="button">Next ▶</button>
        </div>
    </div>

    <script>
        'use strict';

        const METADATA_URL = 'https://raw.githubusercontent.com/Chalwk/SPCLib/master/metadata.json';
        const GITHUB_BASE = 'https://github.com/Chalwk/SPCLib/blob/master';
        const RAW_BASE = 'https://raw.githubusercontent.com/Chalwk/SPCLib/master';

        const RELEASE_TAG_MAP = {
            'sapp_server_templates': 'sapp-server-templates',
            'phasor_server_templates': 'phasor-server-templates',
            'laa_patched': 'laa_patched',
            'battle_royale': 'battle_royale',
            'wordbuster': 'wordbuster',
            'admin_manager': 'AdminManager',
            'pre_game': 'PreGame'
        };

        const PLATFORMS = [
            { key: 'SAPP', label: 'SAPP', icon: '🖥️' },
            { key: 'PHASOR', label: 'Phasor', icon: '⚡' },
            { key: 'CHIMERA', label: 'Chimera', icon: '🐉' },
            { key: 'RELEASES', label: 'Releases', icon: '📦' }
        ];

        let metadata = null;
        let activePlatform = 'SAPP';
        let activeCategory = 'all';
        let searchQuery = '';
        let sortCriterion = 'name_asc';
        let currentPage = 1;
        let pageSize = 10;
        let filteredScriptsCache = [];
        let debounceTimer = null;

        /* ----------------------- Utilities ----------------------- */
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        function debounce(fn, wait) {
            return function (...args) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => fn.apply(this, args), wait);
            };
        }

        function buildSourceUrl(platform, category, fileName) {
            if (platform === 'CHIMERA') return `${GITHUB_BASE}/chimera/global/${fileName}.lua`;
            if (platform === 'RELEASES') {
                const tag = RELEASE_TAG_MAP[fileName] || fileName;
                return `https://github.com/Chalwk/SPCLib/releases/tag/${tag}`;
            }
            return `${GITHUB_BASE}/${platform.toLowerCase()}/${category}/${fileName}.lua`;
        }

        function buildDownloadUrl(platform, category, fileName) {
            if (platform === 'CHIMERA') return `${RAW_BASE}/chimera/global/${fileName}.lua`;
            if (platform === 'RELEASES') return buildSourceUrl(platform, category, fileName);
            return `${RAW_BASE}/${platform.toLowerCase()}/${category}/${fileName}.lua`;
        }

        function flattenMetadata() {
            const scripts = [];
            if (!metadata) return scripts;

            for (const platformKey of Object.keys(metadata)) {
                const platformData = metadata[platformKey];
                const isCategoryBased = (platformKey === 'SAPP' || platformKey === 'PHASOR');

                if (isCategoryBased && typeof platformData === 'object') {
                    for (const [category, scriptsObj] of Object.entries(platformData)) {
                        if (scriptsObj && typeof scriptsObj === 'object') {
                            for (const [fileName, description] of Object.entries(scriptsObj)) {
                                scripts.push({
                                    platform: platformKey,
                                    category,
                                    fileName,
                                    description: typeof description === 'string' ? description : '',
                                    sourceUrl: buildSourceUrl(platformKey, category, fileName),
                                    downloadUrl: buildDownloadUrl(platformKey, category, fileName),
                                    isRelease: false
                                });
                            }
                        }
                    }
                } else if (platformKey === 'RELEASES') {
                    for (const [fileName, description] of Object.entries(platformData)) {
                        scripts.push({
                            platform: platformKey,
                            category: 'release',
                            fileName,
                            description: typeof description === 'string' ? description : '',
                            sourceUrl: buildSourceUrl('RELEASES', '', fileName),
                            downloadUrl: buildDownloadUrl('RELEASES', '', fileName),
                            isRelease: true
                        });
                    }
                } else if (platformKey === 'CHIMERA') {
                    for (const [fileName, description] of Object.entries(platformData)) {
                        scripts.push({
                            platform: platformKey,
                            category: 'global',
                            fileName,
                            description: typeof description === 'string' ? description : '',
                            sourceUrl: buildSourceUrl('CHIMERA', 'global', fileName),
                            downloadUrl: buildDownloadUrl('CHIMERA', 'global', fileName),
                            isRelease: false
                        });
                    }
                }
            }
            return scripts;
        }

        function getPlatformTagClass(platform) {
            const map = { SAPP: 'tag-sapp', PHASOR: 'tag-phasor', CHIMERA: 'tag-chimera', RELEASES: 'tag-release' };
            return map[platform] || 'tag-sapp';
        }

        function filterAndSortScripts() {
            let filtered = flattenMetadata().filter(s => s.platform === activePlatform);

            if ((activePlatform === 'SAPP' || activePlatform === 'PHASOR') && activeCategory !== 'all') {
                filtered = filtered.filter(s => s.category === activeCategory);
            }

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(s =>
                    s.fileName.toLowerCase().includes(q) ||
                    (s.description && s.description.toLowerCase().includes(q)) ||
                    s.category.toLowerCase().includes(q)
                );
            }

            if (sortCriterion === 'name_asc') {
                filtered.sort((a, b) => a.fileName.localeCompare(b.fileName));
            } else if (sortCriterion === 'name_desc') {
                filtered.sort((a, b) => b.fileName.localeCompare(a.fileName));
            }
            return filtered;
        }

        function updateStatsAndRender() {
            const allRaw = flattenMetadata();
            const totalAll = allRaw.length;

            filteredScriptsCache = filterAndSortScripts();
            const totalPlatform = filteredScriptsCache.length;

            let uniqueCategories = 0;
            if (activePlatform === 'SAPP' || activePlatform === 'PHASOR') {
                uniqueCategories = new Set(filteredScriptsCache.map(s => s.category)).size;
            }

            document.getElementById('totalScripts').textContent = totalAll;
            document.getElementById('platformScripts').textContent = totalPlatform;
            document.getElementById('activeCategories').textContent = uniqueCategories || '–';

            const totalPages = Math.ceil(filteredScriptsCache.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            renderScripts();
            updatePaginationUI(totalPages);
        }

        function skeletonCard() {
            return '<div class="skeleton-card" aria-hidden="true"></div>';
        }

        function renderSkeletons(count) {
            const grid = document.getElementById('scriptGrid');
            grid.innerHTML = Array.from({ length: count }, skeletonCard).join('');
        }

        function renderScripts() {
            const grid = document.getElementById('scriptGrid');

            if (!filteredScriptsCache.length) {
                grid.innerHTML = '<div class="empty-state">✨ No scripts found. Try different filters or search.</div>';
                return;
            }

            const start = (currentPage - 1) * pageSize;
            const pageData = filteredScriptsCache.slice(start, start + pageSize);

            grid.innerHTML = pageData.map(script => {
                const displayName = script.isRelease ? script.fileName.replace(/_/g, ' ') : script.fileName;
                const ext = script.isRelease ? '.zip' : '.lua';
                const platformClass = getPlatformTagClass(script.platform);
                const isReleaseScript = script.isRelease;

                return `
                    <article class="script-card">
                        <div class="script-header">
                            <button class="script-name" type="button"
                                data-download-url="${escapeHtml(script.downloadUrl)}"
                                data-filename="${escapeHtml(displayName + ext)}"
                                title="Download ${escapeHtml(displayName + ext)}">
                                ${escapeHtml(displayName)}<span style="opacity:0.7;">${ext}</span>
                            </button>
                            <span class="platform-tag ${platformClass}">${escapeHtml(script.platform)}</span>
                        </div>
                        ${script.description ? `<p class="script-desc">${escapeHtml(script.description)}</p>` : ''}
                        <div class="card-bottom">
                            <div class="card-meta">
                                ${!script.isRelease && script.category !== 'global' ? `<span>📁 ${escapeHtml(script.category)}</span>` : ''}
                            </div>
                            <div class="card-links">
                                ${isReleaseScript
                        ? `<a class="card-link link-release" href="${escapeHtml(script.sourceUrl)}" target="_blank" rel="noopener noreferrer">⬇ Release</a>`
                        : `<a class="card-link link-source" href="${escapeHtml(script.sourceUrl)}" target="_blank" rel="noopener noreferrer">📄 Source</a>`}
                            </div>
                        </div>
                    </article>
                `;
            }).join('');

            grid.querySelectorAll('.script-name').forEach(el => {
                el.addEventListener('click', handleScriptClick);
            });
        }

        async function handleScriptClick(e) {
            const el = e.currentTarget;
            const url = el.getAttribute('data-download-url');
            const filename = el.getAttribute('data-filename');

            if (!url || url.includes('releases/tag/')) {
                window.open(url, '_blank', 'noopener');
                return;
            }

            const originalText = el.innerHTML;
            el.innerHTML = '⏳ Downloading…';
            el.disabled = true;

            try {
                const response = await fetch(url, { mode: 'cors' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename || 'script.lua';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1500);
            } catch (err) {
                console.warn('Direct download failed, opening in new tab:', err);
                window.open(url, '_blank', 'noopener');
            } finally {
                el.innerHTML = originalText;
                el.disabled = false;
            }
        }

        function updatePaginationUI(totalPages) {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');

            if (totalPages === 0) {
                pageInfo.textContent = 'Page 0 of 0';
                prevBtn.classList.add('disabled');
                nextBtn.classList.add('disabled');
                return;
            }

            pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
            prevBtn.classList.toggle('disabled', currentPage <= 1);
            nextBtn.classList.toggle('disabled', currentPage >= totalPages);
        }

        function renderTabs() {
            const container = document.getElementById('platformTabs');
            container.innerHTML = PLATFORMS.map(plat => `
                <button class="tab-btn ${plat.key === activePlatform ? 'active' : ''}"
                    data-platform="${plat.key}"
                    role="tab"
                    aria-selected="${plat.key === activePlatform}"
                    type="button">
                    ${plat.icon} ${plat.label}
                </button>
            `).join('');

            container.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const newPlatform = btn.getAttribute('data-platform');
                    if (newPlatform && newPlatform !== activePlatform) {
                        activePlatform = newPlatform;
                        activeCategory = 'all';
                        searchQuery = '';
                        document.getElementById('searchInput').value = '';
                        currentPage = 1;
                        renderTabs();
                        renderCategoryFilters();
                        updateStatsAndRender();
                    }
                });
            });
        }

        function renderCategoryFilters() {
            const container = document.getElementById('categoryFiltersContainer');

            if (activePlatform !== 'SAPP' && activePlatform !== 'PHASOR') {
                container.innerHTML = '';
                container.style.display = 'none';
                return;
            }
            container.style.display = 'flex';

            const allScripts = flattenMetadata();
            const catMap = new Map();
            for (const script of allScripts) {
                if (script.platform === activePlatform) {
                    catMap.set(script.category, (catMap.get(script.category) || 0) + 1);
                }
            }

            const categories = Array.from(catMap.keys()).sort();
            const total = Array.from(catMap.values()).reduce((a, b) => a + b, 0);

            let html = `<button class="cat-btn ${activeCategory === 'all' ? 'active' : ''}" data-category="all" type="button">All (${total})</button>`;
            for (const cat of categories) {
                html += `<button class="cat-btn ${activeCategory === cat ? 'active' : ''}" data-category="${escapeHtml(cat)}" type="button">${escapeHtml(cat)} (${catMap.get(cat)})</button>`;
            }
            container.innerHTML = html;

            container.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const newCat = btn.getAttribute('data-category');
                    if (newCat && newCat !== activeCategory) {
                        activeCategory = newCat;
                        currentPage = 1;
                        renderCategoryFilters();
                        updateStatsAndRender();
                    }
                });
            });
        }

        function attachGlobalEvents() {
            const searchInput = document.getElementById('searchInput');

            searchInput.addEventListener('input', debounce((e) => {
                searchQuery = e.target.value;
                currentPage = 1;
                updateStatsAndRender();
            }, 250));

            document.getElementById('sortSelect').addEventListener('change', (e) => {
                sortCriterion = e.target.value;
                currentPage = 1;
                updateStatsAndRender();
            });

            document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
                pageSize = parseInt(e.target.value, 10);
                currentPage = 1;
                updateStatsAndRender();
            });

            document.getElementById('clearFiltersBtn').addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                sortCriterion = 'name_asc';
                document.getElementById('sortSelect').value = 'name_asc';
                activeCategory = 'all';
                currentPage = 1;
                renderCategoryFilters();
                updateStatsAndRender();
                searchInput.focus();
            });

            document.getElementById('prevPageBtn').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderScripts();
                    updatePaginationUI(Math.ceil(filteredScriptsCache.length / pageSize));
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            document.getElementById('nextPageBtn').addEventListener('click', () => {
                const total = Math.ceil(filteredScriptsCache.length / pageSize);
                if (currentPage < total) {
                    currentPage++;
                    renderScripts();
                    updatePaginationUI(total);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput &&
                    !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });
        }

        async function fetchMetadata() {
            const statusSpan = document.getElementById('statusMsg');
            renderSkeletons(pageSize);

            try {
                const resp = await fetch(METADATA_URL, { cache: 'no-cache' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                metadata = await resp.json();

                statusSpan.textContent = '✅ Metadata loaded · ready';
                renderTabs();
                renderCategoryFilters();
                updateStatsAndRender();
            } catch (err) {
                console.error(err);
                statusSpan.textContent = '❌ Failed to load metadata';
                document.getElementById('scriptGrid').innerHTML = `
                    <div class="error-box" style="grid-column:1/-1;">
                        <strong>⚠️ Could not fetch metadata.json from GitHub.</strong><br>
                        <span style="font-size:0.85rem;">Check your network connection or try again in a moment.</span><br>
                        <button type="button" id="retryBtn" style="margin-top:10px;">🔁 Retry</button>
                    </div>
                `;
                const retry = document.getElementById('retryBtn');
                if (retry) retry.addEventListener('click', fetchMetadata);
            }
        }

        function init() {
            attachGlobalEvents();
            fetchMetadata();
        }

        init();
    </script>

    <script defer src="../assets/js/script.js"></script>
</body>

</html>
